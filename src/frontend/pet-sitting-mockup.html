<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paws & Relax Pet Sitting</title>
  <style>
    :root {
      --bg: #f7faf8;
      --card: #ffffff;
      --text: #1f2a24;
      --accent: #2f7a55;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, sans-serif;
      background: linear-gradient(160deg, #eef6f1 0%, var(--bg) 100%);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(520px, 100%);
      background: var(--card);
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin-top: 0;
      margin-bottom: 10px;
      font-size: 1.7rem;
    }

    .pricing {
      background: #f1f8f4;
      border: 1px solid #dbeee2;
      border-radius: 10px;
      padding: 12px 14px;
      margin: 18px 0;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 1rem;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <h1>Paws & Relax Pet Sitting</h1>
    <p>Friendly in-home pet sitting for dogs and cats while you are away.</p>

    <section class="pricing" aria-label="Pricing">
      <h2>Pricing</h2>
      <p>30-minute visit: $25</p>
      <p>Overnight stay: $85</p>
    </section>

    <button type="button">Book Now</button>
  </main>
</body>
</html>
